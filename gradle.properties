org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official

# Where the tools and the SDK they build against are checked out. light-web compiles their
# sources directly, unmodified; see README.md.
lightDnd.dir=../light-dnd
# lightphone/light-keyboard, at the tag light-dnd's SDK depends on (v0.0.19).
lightKeyboard.dir=../light-keyboard

# Kotlin 2.3.20's incremental wasm compilation crashes on rebuilds here
# (ArrayIndexOutOfBoundsException in WasmIrFileMetadata). Full rebuilds take ~1 min.
kotlin.incremental.wasm=false
