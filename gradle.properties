org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official

# The tools to build: each one's module directory (the one holding lighttool.toml), in home
# screen order. light-web compiles their sources directly, unmodified; see README.md.
tools=../light-dnd/tool ../light-training/tool ../light-reader/tool
# The SDK the tools compile against: light-dnd's vendored copy.
lightDnd.dir=../light-dnd
# lightphone/light-keyboard, at the tag light-dnd's SDK depends on (v0.0.19).
lightKeyboard.dir=../light-keyboard

# Off along with the stale-output cleanup in build.gradle.kts (compileKotlinWasmJs); see there.
kotlin.incremental.wasm=false
